# Candidate model registry for the vLLM tuner.
#
# Drop in a novel or quantized model = add one entry. Fields:
#   id            HF repo id passed to --model / --served-model-name
#   family        qwen | llama | ... (informational)
#   tool_parser   vLLM --tool-call-parser value; MUST match the model family
#                 (hermes for Qwen2.5/3, llama3_json for Llama-3.x)
#   quantization  null | fp8 | awq | gptq — passed as --quantization when set.
#                 Leave null when the checkpoint is already quantized and vLLM
#                 auto-detects (e.g. *-FP8, *-AWQ repos).
#   ctx_max       upper bound for --max-model-len (<= native max_position_embeddings)
#   min_gpu_gb    rough weight footprint; all fit the Spark's 128 GB unified mem,
#                 kept only as a sanity note
#   enabled       false => skipped by the model screen (flip on to include)
#   notes         why it's a candidate
#
# The GB10 is a SINGLE GPU, so no tensor-parallel entries here.

models:
  - id: Qwen/Qwen2.5-7B-Instruct
    family: qwen
    tool_parser: hermes
    quantization: null
    ctx_max: 32768
    min_gpu_gb: 16
    enabled: false
    notes: Current default. Dense 7B, fast baseline.

  - id: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
    family: qwen
    tool_parser: hermes
    quantization: null            # FP8 checkpoint, auto-detected
    ctx_max: 262144
    min_gpu_gb: 32
    enabled: true
    notes: MoE ~3B active params. Bandwidth-friendly on the Spark; strong quality.

  - id: Qwen/Qwen2.5-14B-Instruct
    family: qwen
    tool_parser: hermes
    quantization: null
    ctx_max: 32768
    min_gpu_gb: 30
    enabled: false
    notes: Dense 14B. Higher quality ceiling, slower decode (bandwidth bound).

  - id: Qwen/Qwen2.5-32B-Instruct-AWQ
    family: qwen
    tool_parser: hermes
    quantization: awq
    ctx_max: 32768
    min_gpu_gb: 20
    enabled: true
    notes: AWQ-quantized 32B. Larger quantized candidate the user asked for.

  - id: meta-llama/Llama-3.1-8B-Instruct
    family: llama
    tool_parser: llama3_json
    quantization: null
    ctx_max: 131072
    min_gpu_gb: 16
    enabled: false      # gated repo — needs HUGGING_FACE_HUB_TOKEN; flip on when set
    notes: Different family for tool-calling diversity. Gated repo (needs HF token).

  # --- room for novel / bigger quantized models — flip enabled:true to include ---
  - id: meta-llama/Llama-3.3-70B-Instruct
    family: llama
    tool_parser: llama3_json
    quantization: fp8
    ctx_max: 131072
    min_gpu_gb: 70
    enabled: false
    notes: Big dense 70B @ FP8. Fits 128 GB but bandwidth-heavy — screen before committing.

  - id: Qwen/Qwen3-32B
    family: qwen
    tool_parser: hermes
    quantization: null
    ctx_max: 32768
    min_gpu_gb: 65
    enabled: false
    notes: Dense 32B Qwen3. Enable to compare against the AWQ 32B / MoE 30B.

  # --- other good tool-callers found 2026-07-24 (verified on HF). MoE ones fit
  # the GB10's bandwidth profile best (low active params = fast decode). Flip
  # enabled:true for the next sweep. Some need per-model extra_args below. ---

  - id: openai/gpt-oss-20b
    family: gpt-oss
    tool_parser: openai        # harmony format; verify parser name on the box's vLLM
    quantization: null         # MXFP4 native, auto-detected (~16 GB)
    ctx_max: 131072
    min_gpu_gb: 16
    enabled: false
    notes: >-
      MoE 21B total / 3.6B active — TOP GB10 pick (very fast on bandwidth-bound HW).
      Needs the harmony response format; if the openai parser errors, check the vLLM
      gpt-oss docs for the current flag.

  - id: mistralai/Mistral-Small-3.2-24B-Instruct-2506
    family: mistral
    tool_parser: mistral
    quantization: null
    ctx_max: 131072
    min_gpu_gb: 48
    enabled: false
    extra_args: "--tokenizer-mode mistral --config-format mistral --load-format mistral"
    notes: Dense 24B, strong/robust tool calling. Quality play between 14B and 32B-AWQ.

  - id: inclusionAI/Ling-2.6-flash-FP8
    family: ling
    tool_parser: hermes        # Ling uses Qwen2.5-style tool format; qwen25 is not a valid vLLM parser (use hermes)
    quantization: null         # FP8 checkpoint, auto-detected (~100 GB — fits 128 GB unified)
    ctx_max: 131072
    min_gpu_gb: 100
    enabled: true
    notes: >-
      Newest OPEN Ant Ling flash: BailingMoe V2.5, 256 experts / 8 active (MoE, fast
      on the bandwidth-bound GB10), 128K context. Runnable stand-in for the API-only
      Ling-3.0-flash. Hybrid-reasoning — if tool calls fail the eval, try
      extra_args: --reasoning-parser inkling (or disable thinking).

  - id: inclusionAI/Ling-3.0-flash
    family: ling
    tool_parser: hermes        # Ling uses Qwen2.5-style tool format; qwen25 is not a valid vLLM parser (use hermes)
    quantization: null
    ctx_max: 262144
    min_gpu_gb: 100
    enabled: false             # API-ONLY at release — no open weights on HF (checked 2026-07-24)
    notes: >-
      124B total / 5.1B active, 256K native context, agent-tuned (~Sonnet-4.6 class).
      Weights NOT released (OpenRouter API only). Flip enabled:true once inclusionAI
      publishes the open checkpoint.

  - id: zai-org/GLM-4.5-Air-FP8
    family: glm
    tool_parser: glm45
    quantization: null         # FP8 checkpoint (~106 GB — TIGHT on 128 GB unified)
    ctx_max: 131072
    min_gpu_gb: 106
    enabled: false
    notes: >-
      MoE 106B total / 12B active, agent-optimized. FP8 to fit 128 GB unified (leave
      prod stopped; keep gpu-util modest). Big but efficient per-token.
