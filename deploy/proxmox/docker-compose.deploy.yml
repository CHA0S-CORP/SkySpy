# Overlay merged on top of the repo docker-compose.yml on the VM:
#   docker compose -f docker-compose.yml \
#                  -f deploy/proxmox/docker-compose.deploy.yml \
#                  --profile acars up -d --build
#
# Adds the reverse proxy (service name "skyspy" so the Cloudflare tunnel's
# http://skyspy:80 resolves on the shared network) and the cloudflared connector.
# The --profile acars flag brings up acars-listener, which runs `manage.py
# run_acars` = the airframes.io firehose poller (no local UDP radio required).

# Portainer Docker Standalone creates stack.env from its stack variables.
# Local Compose can override the file with APP_ENV_FILE (relative to repo root).
services:
  api:
    env_file: ["${APP_ENV_FILE:-stack.env}"]
  celery-worker:
    env_file: ["${APP_ENV_FILE:-stack.env}"]
  celery-worker-realtime:
    env_file: ["${APP_ENV_FILE:-stack.env}"]
  celery-beat:
    env_file: ["${APP_ENV_FILE:-stack.env}"]
  acars-listener:
    env_file: ["${APP_ENV_FILE:-stack.env}"]

  # Reverse proxy. MUST be named `skyspy` — the tunnel ingress points at
  # http://skyspy:80 and resolves it via docker DNS on skyspy-network.
  skyspy:
    image: nginx:alpine
    container_name: skyspy-nginx
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME for the deployment}
      NGINX_ENVSUBST_FILTER: ^SERVER_NAME$
    depends_on:
      - api
    ports:
      - "80:80"          # LAN access on the VM; Cloudflare reaches it in-network
    volumes:
      - ./deploy/proxmox/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      - skyspy-network

  # Cloudflare named tunnel (remote-managed ingress: radar.chaos.navy -> skyspy:80).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: skyspy-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - skyspy
    networks:
      - skyspy-network
